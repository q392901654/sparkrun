<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SparkRun</title>
    <style>
      /* Splash before Vue mounts — no network fonts */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e8edf2;
        color: #0f172a;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0c1017;
          color: #e8eef5;
        }
      }
      #app {
        min-height: 100%;
      }
      #app:empty {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      #app:empty::before {
        content: "SparkRun";
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        opacity: 0.55;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 0.75;
        }
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
