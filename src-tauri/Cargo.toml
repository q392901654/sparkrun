[package]
name = "project-launcher"
version = "0.1.0"
description = "SparkRun — local multi-module project launcher"
authors = ["you"]
edition = "2021"

[lib]
name = "project_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
portable-pty = "0.8"
base64 = "0.22"
notify = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
