[workspace]
resolver = "2"
members = [
    "crates/sparkrun-core",
    "crates/sparkrun-sidecar",
    "src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
walkdir = "2"
portable-pty = "0.8"
base64 = "0.22"
notify = "6"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-util", "io-std", "time"] }
sparkrun-core = { path = "crates/sparkrun-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
